services:
  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:8082:8082"
    volumes:
      - /home/trickfire/discord-bot/data:/data
      - /home/trickfire/discord-bot/secrets.txt:/DiscordBot/secrets.txt:ro
